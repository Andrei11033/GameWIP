name: Task
description: Track planned implementation, cleanup, validation, or repository work.
title: 'task: '
labels:
  - 'type:task'
  - 'priority:normal'
body:
  - type: markdown
    attributes:
      value: |
        Use this template for concrete work that is not a bug report or a feature proposal.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Pick the closest affected area.
      options:
        - CMake / build system
        - FileSystem
        - IO
        - Terminal
        - Unicode
        - Foundation shared systems
        - Logger
        - Assert
        - TestSupport
        - Input
        - Action
        - Desktop
        - Window manager
        - Engine shared systems
        - Windows platform backend
        - Math
        - Rendering
        - Simulation
        - Audio
        - Tools / developer support
        - Documentation
        - GitHub / repository setup
        - Roadmap / planning
        - Gameplay
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or gap makes this work necessary?
      placeholder: Describe the behavior, maintenance gap, or missing repository support.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why now? (optional)
      description: If timing affects prioritization, why does this work belong in the project now?
  - type: textarea
    id: work
    attributes:
      label: Work
      description: What needs to change?
      placeholder: Describe the concrete work to perform.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and scope
      description: What existing contracts, boundaries, or exclusions should guide the work?

  - type: textarea
    id: done
    attributes:
      label: Acceptance criteria
      description: What observable results mean the task is complete?
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: What tests, manual checks, documentation, or inspections should prove this is done?

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: I checked existing issues and documentation for duplicate or already-completed work.
          required: true
