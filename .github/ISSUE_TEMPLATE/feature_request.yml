name: Feature request
description: Propose a new user-facing, game-facing, developer-facing, or workflow capability.
title: 'feature: '
labels:
  - 'type:feature'
  - 'priority:normal'
body:
  - type: markdown
    attributes:
      value: |
        Use this template for a new user-facing, game-facing, developer-facing,
        or workflow capability.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Pick the closest affected area.
      options:
        - CMake / build system
        - FileSystem
        - IO
        - Terminal
        - Unicode
        - Foundation shared systems
        - Logger
        - Assert
        - TestSupport
        - Input
        - Action
        - Window
        - Window manager
        - Engine shared systems
        - Windows platform backend
        - Math
        - Rendering
        - Simulation
        - Audio
        - Tools / developer support
        - Documentation
        - GitHub / repository setup
        - Roadmap / planning
        - Gameplay
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What capability should the project gain?
      placeholder: Describe the outcome, not only one implementation step.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the preferred approach, API, workflow, or behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note other approaches and why they are less suitable.

  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: What tests, manual checks, documentation, or evidence would prove this is done?

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: I checked the roadmap, durable documentation, and existing issues for related work.
          required: true
