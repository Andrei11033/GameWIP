name: Feature request
description: Propose a new user-facing, game-facing, developer-facing, or workflow capability.
title: 'feature: '
labels:
  - 'type:feature'
  - 'priority:normal'
body:
  - type: markdown
    attributes:
      value: |
        Use this template for a new user-facing, game-facing, developer-facing,
        or workflow capability.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Pick the closest affected area.
      options:
        - CMake / build system
        - FileSystem
        - IO
        - Terminal
        - Unicode
        - Foundation shared systems
        - Logger
        - Assert
        - TestSupport
        - Input
        - Action
        - Desktop
        - Window manager
        - Engine shared systems
        - Windows platform backend
        - Math
        - Rendering
        - Simulation
        - Audio
        - Tools / developer support
        - Documentation
        - GitHub / repository setup
        - Roadmap / planning
        - Gameplay
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or missing capability should this work address?
      placeholder: Describe the user, game, developer, or workflow problem.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why now? (optional)
      description: If timing affects prioritization, why does this belong in the project now?
  - type: textarea
    id: goal
    attributes:
      label: Desired outcome
      description: What observable capability should the project gain?
      placeholder: Describe the outcome, not only one implementation step.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and requirements
      description: What existing contracts, platform limits, or scope boundaries must this respect?
  - type: textarea
    id: proposal
    attributes:
      label: Chosen direction
      description: Describe the preferred approach, API, workflow, or behavior when one is known.

  - type: textarea
    id: alternatives
    attributes:
      label: Options considered
      description: Note credible alternatives and why they are less suitable.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable results would show that the outcome is complete?
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: What tests, manual checks, documentation, or evidence would prove this is done?

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: I checked the roadmap, durable documentation, and existing issues for related work.
          required: true
