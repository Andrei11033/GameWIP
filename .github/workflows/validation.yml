name: Validation

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change_scope:
    name: Change Scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      needs_deep: ${{ steps.scope.outputs.needs_deep }}
      needs_docs: ${{ steps.scope.outputs.needs_docs }}
      needs_dependencies: ${{ steps.scope.outputs.needs_dependencies }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t changed_files < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
          else
            mapfile -t changed_files < <(git ls-files)
          fi

          if (( ${#changed_files[@]} == 0 )); then
            changed_files=('__unknown_change__')
          fi

          needs_deep=false
          needs_docs=false

          for path in "${changed_files[@]}"; do
            if [[ "$path" == docs/* || "$path" == *.md || "$path" == *.markdown ]]; then
              needs_docs=true
            fi

            case "$path" in
              .github/*|docs/*|*.md|*.markdown|README.md|CONTRIBUTING.md|SECURITY.md|LICENSE|NOTICE|.editorconfig|.gitignore)
                ;;
              *)
                needs_deep=true
                ;;
            esac
          done

          # Pushes to master and manual dispatches are release-facing validation
          # paths. Keep the full suite and documentation artifact available.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            needs_deep=true
            needs_docs=true
          fi

          needs_dependencies=false
          if [[ "$needs_deep" == true || "$needs_docs" == true ]]; then
            needs_dependencies=true
          fi

          scope=fast
          if [[ "$needs_deep" == true ]]; then
            scope=deep
          elif [[ "$needs_docs" == true ]]; then
            scope=docs
          fi

          {
            echo "scope=$scope"
            echo "needs_deep=$needs_deep"
            echo "needs_docs=$needs_docs"
            echo "needs_dependencies=$needs_dependencies"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Validation scope"
            echo "- Selected path: **$scope**"
            echo "- Deep build, package, coverage, and sanitizer checks: **$needs_deep**"
            echo "- Documentation build: **$needs_docs**"
            echo "- Dependency preparation: **$needs_dependencies**"
          } >> "$GITHUB_STEP_SUMMARY"

  prepare_dependencies:
    name: Prepare dependency cache
    needs: change_scope
    if: needs.change_scope.outputs.needs_dependencies == 'true'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install dependency preparation tools
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake

      - name: Restore locked dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/gamewip/cache/dependencies
          key: gamewip-dependencies-${{ runner.os }}-${{ hashFiles('scripts/config/dependencies.json') }}
          restore-keys: |
            gamewip-dependencies-${{ runner.os }}-

      - name: Prepare pinned dependencies
        shell: pwsh
        run: ./scripts/GameWIP.ps1 deps prepare -Yes -NonInteractive

      - name: Verify pinned dependency cache
        shell: pwsh
        run: ./scripts/GameWIP.ps1 deps check -NonInteractive

  package_compatibility:
    name: Packages (CMake)
    needs: [change_scope, prepare_dependencies]
    if: needs.change_scope.outputs.needs_deep == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install compiler
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja

      - name: Restore locked dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/gamewip/cache/dependencies
          key: gamewip-dependencies-${{ runner.os }}-${{ hashFiles('scripts/config/dependencies.json') }}

      - name: Report CMake version
        shell: msys2 {0}
        run: cmake --version

      - name: Configure package validation
        shell: msys2 {0}
        run: cmake --preset ci-package

      - name: Build package validation
        shell: msys2 {0}
        run: cmake --build --preset ci-package --parallel

      - name: Test installed packages
        shell: msys2 {0}
        run: ctest --test-dir build/ci-package -R validation.packages --output-on-failure --no-tests=error

      - name: Configure multi-config package validation
        shell: msys2 {0}
        run: cmake --preset ci-package-multi

      - name: Test multi-config installed packages
        shell: msys2 {0}
        run: |
          cmake --build --preset ci-package-multi --config RelWithDebInfo --parallel
          ctest --test-dir build/ci-package-multi -C RelWithDebInfo -R validation.packages --output-on-failure --no-tests=error

      - name: Upload package diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-diagnostics-${{ github.run_id }}
          path: |
            build/ci-package/logs
            build/ci-package-multi/logs
          if-no-files-found: ignore
          retention-days: 14

  build_test:
    name: Build and Test
    needs: [change_scope, prepare_dependencies]
    if: needs.change_scope.outputs.needs_deep == 'true'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build tools
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-clang-tools-extra
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Restore locked dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/gamewip/cache/dependencies
          key: gamewip-dependencies-${{ runner.os }}-${{ hashFiles('scripts/config/dependencies.json') }}

      - name: Report CMake version
        shell: msys2 {0}
        run: cmake --version

      - name: Configure
        shell: msys2 {0}
        run: cmake --preset ci-validation

      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset ci-validation --parallel

      - name: Enable required symlink scenarios
        shell: powershell
        run: |
          $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $path -Force | Out-Null
          New-ItemProperty -Path $path -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null

      - name: Prepare pinned Unicode conformance data
        shell: msys2 {0}
        run: |
          python_path="$(cygpath -w "$(command -v python)")"
          helper_path="$(cygpath -w "$PWD/scripts/GameWIP.ps1")"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$helper_path" \
            unicode verify \
            -PythonPath "$python_path"

      - name: Test runtime and project contracts
        shell: msys2 {0}
        env:
          GAMEWIP_REQUIRE_SYMLINK_TESTS: '1'
          GAMEWIP_REQUIRE_UNICODE_CONFORMANCE_TESTS: '1'
        run: ctest --test-dir build/ci-validation --output-on-failure --no-tests=error -LE packages

      - name: Benchmark smoke test
        shell: msys2 {0}
        run: ./build/ci-validation/GameWIPBenchmarks.exe --benchmark_dry_run

      - name: Static analysis
        shell: msys2 {0}
        run: |
          cmake --preset ci-analyze
          cmake --build --preset ci-analyze

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-test-diagnostics-${{ github.run_id }}
          path: build/ci-validation/logs
          if-no-files-found: ignore
          retention-days: 14

  repository_checks:
    name: Repository Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install registry-pinned quality tools
        shell: bash
        run: |
          registry=scripts/config/project-tools.json
          version() { jq -r --arg id "$1" '.tools[] | select(.id == $id) | .requiredVersion' "$registry"; }

          quality_python="$GITHUB_WORKSPACE/build/gamewip/tools/python"
          python3 -m venv "$quality_python"
          "$quality_python/bin/python" -m pip install --upgrade pip
          "$quality_python/bin/pip" install \
            "clang-format==22.1.8" \
            "ruff==$(version ruff)" \
            "yamllint==$(version yamllint)" \
            "jsonschema==$(version jsonschema)"
          echo "$quality_python/bin" >> "$GITHUB_PATH"

          gersemi_repository="$(jq -r '.tools[] | select(.id == "gersemi") | .provider.repository' "$registry")"
          gersemi_tag="$(jq -r '.tools[] | select(.id == "gersemi") | .provider.releaseTag' "$registry")"
          gersemi_asset="$(jq -r '.tools[] | select(.id == "gersemi") | .provider.assets["linux-amd64"].archive' "$registry")"
          gersemi_sha256="$(jq -r '.tools[] | select(.id == "gersemi") | .provider.assets["linux-amd64"].sha256' "$registry")"
          gersemi_download="$RUNNER_TEMP/$gersemi_asset"
          gersemi_bin="$RUNNER_TEMP/gamewip-quality-bin"
          mkdir -p "$gersemi_bin"
          curl --fail --location --silent --show-error \
            --output "$gersemi_download" \
            "https://github.com/$gersemi_repository/releases/download/$gersemi_tag/$gersemi_asset"
          printf '%s  %s\n' "$gersemi_sha256" "$gersemi_download" | sha256sum --check -
          install -m 0755 "$gersemi_download" "$gersemi_bin/gersemi"
          "$gersemi_bin/gersemi" --version
          echo "$gersemi_bin" >> "$GITHUB_PATH"

          eslint_js_version="$(jq -r \
            '.tools[] | select(.id == "eslint") | .provider.dependencies[] | select(.package == "@eslint/js") | .version' \
            "$registry")"
          prettier_powershell_version="$(jq -r \
            '.tools[] | select(.id == "prettier") | .provider.dependencies[] | select(.package == "prettier-plugin-powershell") | .version' \
            "$registry")"
          npm install --global \
            "eslint@$(version eslint)" \
            "@eslint/js@$eslint_js_version" \
            "prettier@$(version prettier)" \
            "prettier-plugin-powershell@$prettier_powershell_version" \
            "markdownlint-cli2@$(version markdownlint-cli2)"

      - name: Install registry-pinned PowerShell analyzer
        shell: pwsh
        run: |
          $registry = Get-Content scripts/config/project-tools.json -Raw | ConvertFrom-Json
          $version = ($registry.tools | Where-Object id -EQ psscriptanalyzer).requiredVersion
          Install-Module PSScriptAnalyzer -RequiredVersion $version -Scope CurrentUser -Force

      - name: Check JavaScript
        shell: bash
        run: |
          for file in .github/scripts/*.js; do
            node --check "$file"
          done
          node --test .github/scripts/*.test.js

      - name: Check PowerShell workflow helper
        shell: pwsh
        run: |
          $qualityPython = Join-Path $env:GITHUB_WORKSPACE 'build/gamewip/tools/python/bin'
          $env:PATH = "$qualityPython$([IO.Path]::PathSeparator)$env:PATH"
          ./.github/scripts/WorkflowHelper.Tests.ps1
          ./.github/scripts/ProjectHelper.Tests.ps1
          ./.github/scripts/SetupHelper.Tests.ps1

      - name: Check JSON
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            jq empty "$file"
          done < <(find . -type f -name '*.json' \
            -not -path './external/*' \
            -not -path './build/*' \
            -print0)

      - name: Check Python scripts
        shell: bash
        run: |
          python3 -m py_compile .github/scripts/*.py
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Install actionlint
        shell: bash
        run: |
          registry="scripts/config/project-tools.json"
          tag="$(jq -r '.tools[] | select(.id == "actionlint") | .provider.releaseTag' "$registry")"
          archive="$(jq -r '.tools[] | select(.id == "actionlint") | .provider.assets["linux-amd64"].archive' "$registry")"
          sha256="$(jq -r '.tools[] | select(.id == "actionlint") | .provider.assets["linux-amd64"].sha256' "$registry")"
          url="https://github.com/rhysd/actionlint/releases/download/${tag}/${archive}"
          archive_path="$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location --output "$archive_path" "$url"
          echo "${sha256}  ${archive_path}" | sha256sum --check
          tar --extract --gzip --directory "$RUNNER_TEMP" --file "$archive_path" actionlint
          chmod 0755 "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run complete repository quality policy
        shell: pwsh
        run: |
          $qualityPython = Join-Path $env:GITHUB_WORKSPACE 'build/gamewip/tools/python/bin'
          $env:PATH = "$qualityPython$([IO.Path]::PathSeparator)$env:PATH"
          ./scripts/GameWIP.ps1 quality check

  coverage:
    name: Coverage
    needs: [change_scope, prepare_dependencies]
    if: needs.change_scope.outputs.needs_deep == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install coverage tools
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcovr

      - name: Restore locked dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/gamewip/cache/dependencies
          key: gamewip-dependencies-${{ runner.os }}-${{ hashFiles('scripts/config/dependencies.json') }}

      - name: Report CMake version
        shell: msys2 {0}
        run: cmake --version

      - name: Configure
        shell: msys2 {0}
        run: cmake --preset ci-coverage

      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset ci-coverage --parallel

      - name: Test
        shell: msys2 {0}
        run: ctest --preset ci-coverage

      - name: Generate report
        shell: msys2 {0}
        run: cmake --build build/ci-coverage --target coverage

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: build/ci-coverage/coverage
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-diagnostics-${{ github.run_id }}
          path: build/ci-coverage/logs
          if-no-files-found: ignore
          retention-days: 14

  address_sanitizer:
    name: AddressSanitizer
    needs: [change_scope, prepare_dependencies]
    if: needs.change_scope.outputs.needs_deep == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install CLANG64 tools
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-compiler-rt
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-ninja

      - name: Restore locked dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/gamewip/cache/dependencies
          key: gamewip-dependencies-${{ runner.os }}-${{ hashFiles('scripts/config/dependencies.json') }}

      - name: Report CMake version
        shell: msys2 {0}
        run: cmake --version

      - name: Configure
        shell: msys2 {0}
        run: cmake --preset ci-asan

      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset ci-asan --parallel

      - name: Test
        shell: msys2 {0}
        run: ctest --preset ci-asan

      - name: Upload sanitizer diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asan-diagnostics-${{ github.run_id }}
          path: build/ci-asan/logs
          if-no-files-found: ignore
          retention-days: 14

  docs_check:
    name: Docs Check
    needs: [change_scope, prepare_dependencies]
    if: needs.change_scope.outputs.needs_docs == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install documentation tools
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-doxygen
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-graphviz
            mingw-w64-ucrt-x86_64-ninja

      - name: Restore locked dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/gamewip/cache/dependencies
          key: gamewip-dependencies-${{ runner.os }}-${{ hashFiles('scripts/config/dependencies.json') }}

      - name: Report CMake version
        shell: msys2 {0}
        run: cmake --version

      - name: Configure documentation build
        shell: msys2 {0}
        run: cmake --preset ci-docs

      - name: Build documentation
        shell: msys2 {0}
        run: cmake --build --preset ci-docs --verbose

      - name: Retain validated documentation for Pages
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doxygen-pages
          path: build/ci-docs/docs/doxygen/html
          if-no-files-found: error
          retention-days: 14

      - name: Upload documentation diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-diagnostics-${{ github.run_id }}
          path: build/ci-docs/docs/doxygen
          if-no-files-found: ignore
          retention-days: 14

  validation_gate:
    name: Gate
    if: always()
    needs:
      - change_scope
      - prepare_dependencies
      - package_compatibility
      - build_test
      - repository_checks
      - coverage
      - address_sanitizer
      - docs_check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify selected validation path
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.change_scope.result }}
          SCOPE: ${{ needs.change_scope.outputs.scope }}
          NEEDS_DEEP: ${{ needs.change_scope.outputs.needs_deep }}
          NEEDS_DOCS: ${{ needs.change_scope.outputs.needs_docs }}
          PREPARE_RESULT: ${{ needs.prepare_dependencies.result }}
          PACKAGE_RESULT: ${{ needs.package_compatibility.result }}
          BUILD_RESULT: ${{ needs.build_test.result }}
          REPOSITORY_RESULT: ${{ needs.repository_checks.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          ASAN_RESULT: ${{ needs.address_sanitizer.result }}
          DOCS_RESULT: ${{ needs.docs_check.result }}
        run: |
          set -euo pipefail

          failures=()

          [[ "$SCOPE_RESULT" == success ]] || failures+=("Change Scope: $SCOPE_RESULT")
          [[ "$REPOSITORY_RESULT" == success ]] || failures+=("Repository Checks: $REPOSITORY_RESULT")

          if [[ "$NEEDS_DEEP" == true || "$NEEDS_DOCS" == true ]]; then
            [[ "$PREPARE_RESULT" == success ]] || failures+=("Prepare dependency cache: $PREPARE_RESULT")
          fi

          if [[ "$NEEDS_DEEP" == true ]]; then
            [[ "$PACKAGE_RESULT" == success ]] || failures+=("Packages (CMake): $PACKAGE_RESULT")
            [[ "$BUILD_RESULT" == success ]] || failures+=("Build and Test: $BUILD_RESULT")
            [[ "$COVERAGE_RESULT" == success ]] || failures+=("Coverage: $COVERAGE_RESULT")
            [[ "$ASAN_RESULT" == success ]] || failures+=("AddressSanitizer: $ASAN_RESULT")
          fi

          if [[ "$NEEDS_DOCS" == true ]]; then
            [[ "$DOCS_RESULT" == success ]] || failures+=("Docs Check: $DOCS_RESULT")
          fi

          if (( ${#failures[@]} > 0 )); then
            printf 'Validation gate failed for %s scope:\n' "$SCOPE"
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi

          echo "Validation gate passed for $SCOPE scope."
