name: Validation

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-compatibility:
    name: Packages (CMake ${{ matrix.cmake }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cmake: ["~3.23.0", "~3.29.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install compiler
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc

      - name: Install compatibility CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ matrix.cmake }}
          ninjaVersion: "^1.11.1"

      - name: Configure package validation
        shell: msys2 {0}
        run: >
          cmake -S . -B build/package-compatibility
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGAMEWIP_BUILD_GAME=OFF
          -DGAMEWIP_BUILD_TESTS=ON
          -DGAMEWIP_BUILD_BENCHMARKS=OFF
          -DGAMEWIP_RUN_TESTS_AT_STARTUP=OFF
          -DGAMEWIP_RUN_BENCHMARKS_AT_STARTUP=OFF
          -DGAMEWIP_ENABLE_TRACY=OFF
          -DGAMEWIP_ENABLE_ASSERTS=ON

      - name: Build package validation
        shell: msys2 {0}
        run: cmake --build build/package-compatibility --target GameWIPTests --parallel

      - name: Test installed packages
        shell: msys2 {0}
        run: ctest --test-dir build/package-compatibility -R validation.packages --output-on-failure

      - name: Configure multi-config package validation
        if: matrix.cmake == '~3.29.0'
        shell: msys2 {0}
        run: >
          cmake -S . -B build/package-multi-config
          -G "Ninja Multi-Config"
          -DGAMEWIP_BUILD_GAME=OFF
          -DGAMEWIP_BUILD_TESTS=ON
          -DGAMEWIP_BUILD_BENCHMARKS=OFF
          -DGAMEWIP_RUN_TESTS_AT_STARTUP=OFF
          -DGAMEWIP_RUN_BENCHMARKS_AT_STARTUP=OFF
          -DGAMEWIP_ENABLE_TRACY=OFF
          -DGAMEWIP_ENABLE_ASSERTS=ON

      - name: Test multi-config installed packages
        if: matrix.cmake == '~3.29.0'
        shell: msys2 {0}
        run: |
          cmake --build build/package-multi-config --target GameWIPTests --config RelWithDebInfo --parallel
          ctest --test-dir build/package-multi-config -C RelWithDebInfo -R validation.packages --output-on-failure

  build-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-clang-tools-extra
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Configure
        shell: msys2 {0}
        run: >
          cmake -S . -B build/validation
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGAMEWIP_BUILD_GAME=ON
          -DGAMEWIP_BUILD_TESTS=ON
          -DGAMEWIP_BUILD_BENCHMARKS=ON
          -DGAMEWIP_RUN_TESTS_AT_STARTUP=OFF
          -DGAMEWIP_RUN_BENCHMARKS_AT_STARTUP=OFF
          -DGAMEWIP_ENABLE_TRACY=OFF
          -DGAMEWIP_ENABLE_TOOLS=OFF
          -DGAMEWIP_OPEN_TOOLS_AT_STARTUP=OFF
          -DGAMEWIP_ENABLE_ASSERTS=ON

      - name: Build
        shell: msys2 {0}
        run: cmake --build build/validation --parallel

      - name: Enable required symlink scenarios
        shell: powershell
        run: |
          $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $path -Force | Out-Null
          New-ItemProperty -Path $path -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null

      - name: Test
        shell: msys2 {0}
        env:
          GAMEWIP_REQUIRE_SYMLINK_TESTS: "1"
        run: ctest --test-dir build/validation --output-on-failure

      - name: Benchmark smoke test
        shell: msys2 {0}
        run: ./build/validation/GameWIPBenchmarks.exe --benchmark_dry_run

      - name: Static analysis
        shell: msys2 {0}
        run: |
          cmake --preset static-analysis
          cmake --build --preset static-analysis

  repository-checks:
    name: Repository Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript
        shell: bash
        run: |
          for file in .github/scripts/*.js; do
            node --check "$file"
          done
          node --test .github/scripts/*.test.js

      - name: Check JSON
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            jq empty "$file"
          done < <(find . -type f -name '*.json' \
            -not -path './external/*' \
            -not -path './build/*' \
            -print0)

      - name: Check Python scripts
        shell: bash
        run: python3 -m py_compile .github/scripts/check-markdown-links.py

      - name: Check Markdown links
        shell: bash
        run: python3 .github/scripts/check-markdown-links.py

      - name: Check GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  coverage:
    name: Coverage
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install coverage tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcovr

      - name: Configure
        shell: msys2 {0}
        run: cmake --preset coverage

      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset coverage --parallel

      - name: Test
        shell: msys2 {0}
        run: ctest --preset coverage

      - name: Generate report
        shell: msys2 {0}
        run: cmake --build build/coverage --target coverage

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/coverage

  address-sanitizer:
    name: AddressSanitizer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install CLANG64 tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-compiler-rt
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: cmake --preset address-sanitizer

      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset address-sanitizer --parallel

      - name: Test
        shell: msys2 {0}
        run: ctest --preset address-sanitizer

  docs-check:
    name: Docs Check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install documentation tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-doxygen
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-graphviz
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure documentation build
        shell: msys2 {0}
        run: >
          cmake -S . -B build/docs
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGAMEWIP_BUILD_GAME=OFF
          -DGAMEWIP_BUILD_TESTS=OFF
          -DGAMEWIP_RUN_TESTS_AT_STARTUP=OFF
          -DGAMEWIP_RUN_BENCHMARKS_AT_STARTUP=OFF
          -DGAMEWIP_BUILD_DOCS=ON
          -DGAMEWIP_ENABLE_TRACY=OFF

      - name: Build documentation
        shell: msys2 {0}
        run: cmake --build build/docs --target docs --verbose
