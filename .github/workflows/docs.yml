name: Doxygen Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install documentation tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-doxygen
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-graphviz
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure documentation build
        shell: msys2 {0}
        run: >
          cmake -S . -B build-docs
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGAMEWIP_BUILD_GAME=OFF
          -DGAMEWIP_BUILD_TESTS=OFF
          -DGAMEWIP_RUN_TESTS_AT_STARTUP=OFF
          -DGAMEWIP_RUN_BENCHMARKS_AT_STARTUP=OFF
          -DGAMEWIP_BUILD_DOCS=ON
          -DGAMEWIP_ENABLE_TRACY=OFF

      - name: Build documentation
        shell: msys2 {0}
        run: cmake --build build-docs --target docs --verbose

      - name: Check Doxygen warnings
        shell: msys2 {0}
        run: |
          if [ -s build-docs/docs/doxygen/doxygen_warnings.log ]; then
            cat build-docs/docs/doxygen/doxygen_warnings.log
            exit 1
          fi

      - name: Disable Jekyll processing
        shell: powershell
        run: New-Item -ItemType File -Path build-docs/docs/doxygen/html/.nojekyll -Force

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build-docs/docs/doxygen/html

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
