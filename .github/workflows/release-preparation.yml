name: Release Preparation

on:
  issues:
    types:
      - opened
      - closed
      - reopened
      - milestoned
      - demilestoned
  milestone:
    types:
      - opened
      - closed
      - edited
      - deleted
  workflow_dispatch:
    inputs:
      command:
        description: Check readiness, prepare the release PR, or finalize the release.
        required: true
        default: check
        type: choice
        options:
          - check
          - prepare
          - finalize
      dry_run:
        description: Report planned actions without mutating GitHub.
        required: true
        default: true
        type: boolean
      release_commit:
        description: Exact master commit to finalize. Required for finalization writes.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  manual-write-approval:
    name: Approve Manual Release Write
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.command == 'finalize' && 'release-production' || 'maintainer-write' }}
    steps:
      - name: Validate environment protection
        env:
          PROTECTION_CONFIGURED: ${{ inputs.command == 'finalize' && secrets.RELEASE_PRODUCTION_PROTECTION_CONFIGURED || secrets.MANUAL_WRITE_PROTECTION_CONFIGURED }}
        run: |
          if [ "$PROTECTION_CONFIGURED" != "required-reviewer" ]; then
            echo "The selected release environment must have a required reviewer before writes are enabled." >&2
            exit 1
          fi
      - name: Record approval
        run: echo "Protected-environment approval granted for the manual release operation."

  release-preparation:
    name: Release Preparation
    needs:
      - manual-write-approval
    if: >-
      always() &&
      (needs.manual-write-approval.result == 'success' ||
       needs.manual-write-approval.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted release automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate release token
        env:
          RELEASE_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "PROJECT_TOKEN must contain a token that can read repo state and create release-preparation branches, pull requests, tags, and releases." >&2
            exit 1
          fi

      - name: Run release preparation
        uses: actions/github-script@v8
        env:
          ACTIVE_MILESTONE: ${{ vars.ACTIVE_MILESTONE }}
          RELEASE_COMMAND: ${{ github.event_name == 'workflow_dispatch' && inputs.command || 'check' }}
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
          RELEASE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_commit || '' }}
          ALLOW_NOT_READY: ${{ github.event_name != 'workflow_dispatch' }}
          REQUIRED_CHECKS: |
            Validation
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const releasePreparation = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-preparation.js`);
            await releasePreparation.run({github, context, core});
