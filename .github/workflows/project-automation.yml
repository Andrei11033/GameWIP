name: Project Automation

on:
  issues:
    types:
      - opened
      - edited
      - closed
      - reopened
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
  pull_request_target:
    branches:
      - master
    types:
      - opened
      - edited
      - closed
      - reopened
      - synchronize
      - converted_to_draft
      - ready_for_review
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: Reconcile all items or one issue/pull request.
        required: true
        default: all
        type: choice
        options:
          - all
          - issue
          - pull_request
      number:
        description: Issue or pull request number for focused reconciliation.
        required: false
        type: string
      dry_run:
        description: Report desired changes without updating GitHub.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: project-automation
  cancel-in-progress: false

jobs:
  manual-write-approval:
    name: Approve Manual Project Write
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: maintainer-write
    steps:
      - name: Validate environment protection
        env:
          PROTECTION_CONFIGURED: ${{ secrets.MANUAL_WRITE_PROTECTION_CONFIGURED }}
        run: |
          if [ "$PROTECTION_CONFIGURED" != "required-reviewer" ]; then
            echo "maintainer-write must have a required reviewer before manual writes are enabled." >&2
            exit 1
          fi
      - name: Record approval
        run: echo "Protected-environment approval granted for manual project reconciliation."

  reconcile:
    name: Reconcile Project
    needs:
      - manual-write-approval
    if: >-
      always() &&
      (needs.manual-write-approval.result == 'success' ||
       needs.manual-write-approval.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate project token
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "PROJECT_TOKEN must contain a token with repo and project scopes." >&2
            exit 1
          fi

      - name: Reconcile project metadata and status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          ACTIVE_MILESTONE: ${{ vars.ACTIVE_MILESTONE }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const automation = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/project-automation.js`);
            await automation.run({github, context, core});
