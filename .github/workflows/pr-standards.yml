name: PR Standards

on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  standards:
    name: Check PR Standards
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted policy code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: trusted-policy
      - name: Check out bootstrap policy code
        if: hashFiles('trusted-policy/.github/scripts/pr-standards.js') == ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: bootstrap-policy
      - name: Validate pull request metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const trustedPolicy = path.join(process.env.GITHUB_WORKSPACE, "trusted-policy", ".github", "scripts", "pr-standards.js");
            const bootstrapPolicy = path.join(process.env.GITHUB_WORKSPACE, "bootstrap-policy", ".github", "scripts", "pr-standards.js");
            const policy = fs.existsSync(trustedPolicy) ? trustedPolicy : bootstrapPolicy;
            if (policy === bootstrapPolicy) {
              core.warning("Using pull-request policy code because the base branch does not contain the policy module yet.");
            }
            const { validatePullRequest } = require(policy);
            const errors = validatePullRequest(context.payload.pull_request);
            if (errors.length) core.setFailed(errors.map((error) => `- ${error}`).join("\n"));
            else core.info("PR metadata follows the repository standards.");
