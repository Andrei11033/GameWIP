name: PR Standards

on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  standards:
    name: Check PR Standards
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted policy code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: trusted-policy
      - name: Validate pull request metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { validatePullRequest } = require(
              `${process.env.GITHUB_WORKSPACE}/trusted-policy/.github/scripts/pr-standards.js`,
            );
            const errors = validatePullRequest(context.payload.pull_request);
            if (errors.length) core.setFailed(errors.map((error) => `- ${error}`).join("\n"));
            else core.info("PR metadata follows the repository standards.");
