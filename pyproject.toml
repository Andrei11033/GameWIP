[tool.ruff]
line-length = 150
indent-width = 4
target-version = "py310"
exclude = ["build", "external"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
